        - paragraph [ref=f9e37]: Our story
        - heading "Boring about the basics." [level=1] [ref=f9e38]
      - paragraph [ref=f9e40]: Novera supplies research-grade peptides to laboratories. Every batch arrives sealed, assayed by an independent lab, and traceable to a certificate you can read before you buy.
    - img "A sunlit laboratory bench lined with clean glassware beside a full-height window" [ref=f9e44]
    - generic [ref=f9e46]:
      - generic [ref=f9e47]:
        - paragraph [ref=f9e48]: The beginning
        - heading "Verified sourcing, finished with paperwork." [level=2] [ref=f9e49]
        - generic [ref=f9e50]:
          - paragraph [ref=f9e51]: "Novera began with a frustration familiar to anyone who has sourced research peptides: the label said one thing, the vial said another, and nobody answered the email. We thought a reference compound should arrive exactly as described — assayed, sealed, cold, and traceable to a batch."
          - paragraph [ref=f9e52]: So we built a supplier around the parts of the job most people skip. Direct manufacturer contracts. An independent assay on every batch. Cold storage from the moment a pen is filled to the moment it is scanned by the courier. And a real person who answers when you ask which batch is on the shelf.
      - img "A woman at a sunlit counter with sealed ALLUVI NAD+ and MOTS-C cartons" [ref=f9e56]
