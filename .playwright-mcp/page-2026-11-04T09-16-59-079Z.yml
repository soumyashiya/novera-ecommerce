        - heading "The Novera standard." [level=2] [ref=f9e98]
      - generic [ref=f9e99]:
        - generic [ref=f9e101]:
          - term [ref=f9e102]: Sourced direct
          - definition [ref=f9e103]: Direct contracts with certified manufacturers, produced under tightly controlled, ISO-aligned processes. No grey-market resellers anywhere in the chain.
        - generic [ref=f9e105]:
          - term [ref=f9e106]: Assayed independently
          - definition [ref=f9e107]: Every batch goes to Janoshik Analytical for purity and concentration before it is listed. We publish the report, not a summary of it.
        - generic [ref=f9e109]:
          - term [ref=f9e110]: Cold-stored, sealed
          - definition [ref=f9e111]: Pens are held at 2–8 °C in temperature-stable, tamper-evident packaging, and labelled accurately before they leave the shelf.
        - generic [ref=f9e113]:
          - term [ref=f9e114]: A considered range
          - definition [ref=f9e115]: 8 lines, not eighty. Each one stocked in the concentrations researchers actually ask for, and restocked batch by batch.
