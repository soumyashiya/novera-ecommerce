              - paragraph [ref=f1e908]:
                - strong [ref=f1e909]: Digestion
                - text: 1. As part of a healthy diet containing a variety of foods, AG1 is a source of:Calcium contributes to the normal function of digestive enzymes.Biotin contributes to the maintenance of normal mucous membranes (e.g., intestinal mucosa).
              - paragraph [ref=f1e910]:
                - strong [ref=f1e911]: Immune System
                - text: 2. As part of a healthy diet containing a variety of foods, AG1 is a source of:Copper, folate, selenium, zinc, and vitamins A, B12, B6, and C contribute to the normal function of the immune system.
              - paragraph [ref=f1e912]:
                - strong [ref=f1e913]: Mental Performance; Cognitive Function; Nervous System; Psychological Function
                - text: 3. As part of a healthy diet containing a variety of foods, AG1 is a source of:Vitamins C, B6, B12, riboflavin, niacin, pantothenic acid and folic acid contribute to the reduction of tiredness and fatigue.Pantothenic acid contributes to normal mental performance.Zinc contributes to normal cognitive function.Vitamins C, B6, B12, thiamine, riboflavin, niacin, biotin, copper and potassium contribute to normal functioning of the nervous system.Thiamine, niacin, vitamin B6, vitamin B12, biotin, folate, and vitamin C contribute to normal psychological function.
              - paragraph [ref=f1e914]:
                - strong [ref=f1e915]: Metabolism
                - text: 4. As part of a healthy diet containing a variety of foods, AG1 is a source of:Vitamins C, B6 and B12, as well as thiamine, riboflavin, niacin, biotin, pantothenic acid, calcium, phosphorus, copper, and manganese contribute to normal energy-yielding metabolism.Biotin, zinc, and chromium contribute to normal macronutrient metabolism.Vitamin A and riboflavin contribute to normal metabolism of iron.Zinc contributes to normal acid-base metabolism.Molybdenum contributes to normal sulphur amino acid metabolism.
              - paragraph [ref=f1e916]:
                - strong [ref=f1e917]: Healthy Cells
                - text: 5. As part of a healthy diet containing a variety of foods, AG1 is a source of:Vitamins E and C, as well as riboflavin, zinc, copper, manganese and selenium, contribute to the protection of cells from oxidative stress.Phosphorus contributes to normal function of cell membranes.
              - paragraph [ref=f1e918]:
                - strong [ref=f1e919]: Hormonal Health
                - text: 6. As part of a healthy diet containing a variety of foods, AG1 is a source of:Vitamin B6 contributes to the regulation of hormonal activity.Pantothenic acid contributes to normal synthesis and metabolism of steroid hormones, vitamin D and some neurotransmitters.Zinc contributes to the maintenance of normal testosterone levels in the blood.Selenium contributes to the normal utilisation of iodine in the production of thyroid hormones.Zinc contributes to normal fertility and reproduction.Selenium contributes to normal spermatogenesis.
              - paragraph [ref=f1e920]:
                - strong [ref=f1e921]: Heart Health
                - text: 7. As part of a healthy diet containing a variety of foods, AG1 is a source of:Thiamine contributes to the normal function of the heart.Vitamin C contributes to normal blood vessels structure and function.Vitamin B6 contributes to normal red blood cell formation.Vitamin B2 contributes to the maintenance of normal red blood cells.
