  - main [ref=f37e33]:
    - generic [ref=f37e35]:
      - generic [ref=f37e36]:
        - paragraph [ref=f37e37]: Our story
        - heading "Nothing ships unproven." [level=1] [ref=f37e38]
      - paragraph [ref=f37e40]: Novera supplies research peptides to laboratories. Every pen we list has been through an independent lab first, and the report it came back with sits on the product page before anyone can order it.
    - img "A sunlit laboratory bench lined with clean glassware beside a full-height window" [ref=f37e44]
    - generic [ref=f37e46]:
      - generic [ref=f37e47]:
        - paragraph [ref=f37e48]: Why we started
        - heading "We built the supplier we kept looking for." [level=2] [ref=f37e49]
        - generic [ref=f37e50]:
          - paragraph [ref=f37e51]: Anyone who has ordered research compounds knows the pattern. A certificate that names no laboratory. A concentration that does not survive contact with a mass spectrometer. An inbox that goes quiet the moment you ask which batch you were actually sent. None of it is exotic — it is simply what happens when nobody independent ever checks.
          - paragraph [ref=f37e52]: Novera exists to take that guesswork off the front of an experiment. We contract directly with the manufacturers who fill our pens, send every batch out for an independent assay before it is listed, keep the range refrigerated from fill to courier, and answer when you ask what is on the shelf. It is unremarkable work. It is also the whole job.
      - img "A woman at a sunlit counter with sealed ALLUVI NAD+ and MOTS-C cartons" [ref=f37e56]
