    - generic [ref=f37e95]:
      - generic [ref=f37e96]:
        - paragraph [ref=f37e97]: What we hold to
        - heading "The Novera standard." [level=2] [ref=f37e98]
      - generic [ref=f37e99]:
        - generic [ref=f37e101]:
          - term [ref=f37e102]: Contracted at source
          - definition [ref=f37e103]: We buy from the manufacturers who fill the pens, under tightly controlled, ISO-aligned production. Nothing reaches our shelves through an intermediary we cannot name.
        - generic [ref=f37e105]:
          - term [ref=f37e106]: Assayed by someone else
          - definition [ref=f37e107]: Purity and concentration are measured by Janoshik Analytical, not by us. Their report is published whole — batch number, method and figures — never compressed into a claim.
        - generic [ref=f37e109]:
          - term [ref=f37e110]: Cold from fill to courier
          - definition [ref=f37e111]: Pens stay at 2–8 °C in temperature-stable, tamper-evident packaging, and every label is checked against the assay before the box is sealed.
        - generic [ref=f37e113]:
          - term [ref=f37e114]: Short on purpose
          - definition [ref=f37e115]: 8 lines rather than a catalogue. We would sooner restock one compound properly than list forty we cannot keep verified.
    - generic [ref=f37e118]:
      - paragraph [ref=f37e119]: Dull by design.
      - paragraph [ref=f37e120]: The least interesting variable in your experiment should be the compound.
    - generic [ref=f37e121]:
      - generic [ref=f37e122]:
        - paragraph [ref=f37e123]: How a batch reaches you
        - heading "A verified batch, end to end." [level=2] [ref=f37e124]
      - list [ref=f37e125]:
        - listitem [ref=f37e126]:
          - paragraph [ref=f37e129]: "01"
          - paragraph [ref=f37e130]: Contracted and logged
          - paragraph [ref=f37e131]: The batch arrives sealed from the manufacturer and is booked in against a batch number that follows it from here on.
        - listitem [ref=f37e132]:
          - paragraph [ref=f37e135]: "02"
          - paragraph [ref=f37e136]: Sent out for assay
          - paragraph [ref=f37e137]: Janoshik Analytical measure purity and concentration independently. We do not run the test and cannot adjust the result.
        - listitem [ref=f37e138]:
          - paragraph [ref=f37e141]: "03"
          - paragraph [ref=f37e142]: Report published
          - paragraph [ref=f37e143]: The certificate goes live on the product page, batch number and all, before a single pen from that batch is sold.
        - listitem [ref=f37e144]:
          - paragraph [ref=f37e147]: "04"
          - paragraph [ref=f37e148]: Sealed and sent cold
          - paragraph [ref=f37e149]: Held at 2–8 °C in tamper-evident packaging until the courier scans it off the shelf.
    - generic [ref=f37e152]:
